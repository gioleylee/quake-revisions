name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest -v
      - run: python catalog.py --db smoke.sqlite import data/jan-2024.geojson
      - run: python summarize.py smoke.sqlite 2024-01
